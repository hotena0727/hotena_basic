# --- Add these blocks INSIDE your existing `server { ... }` in nginx.default.conf.template ---
# Purpose: serve service worker at /sw.js so its scope can be "/"
# Assumes your repo already has the file at: /app/static/sw.js

# (Optional but recommended) Make sure browsers are allowed to use SW for the whole origin
# Without this header, some setups restrict scope based on the SW file location.
location = /sw.js {
    alias /app/static/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
}

# If you want a root manifest too (optional)
# Assumes your repo has: /app/static/pwa-manifest.json
location = /manifest.json {
    alias /app/static/pwa-manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Icons (optional, only if you want /icon-192.png etc at root)
location = /icon-192.png { alias /app/static/icon-192.png; }
location = /icon-512.png { alias /app/static/icon-512.png; }
