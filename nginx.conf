http {
  include /etc/nginx/mime.types;

  types {
    application/javascript  js;
  }

  server {
    listen 8080;

    # ✅ 공통 PWA/아이콘 파일: 루트 제공
    location = /manifest.json        { root /app/static_root; }
    location = /sw.js {
  root /app/static_root;
  add_header Cache-Control "no-store";
  add_header X-Served-By "nginx" always;
}


    location = /apple-touch-icon.png { root /app/static_root; }
    location = /icon-192.png         { root /app/static_root; }
    location = /icon-512.png         { root /app/static_root; }
    location = /favicon.ico          { root /app/static_root; }

    # ✅ 나머지 요청은 Streamlit
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
