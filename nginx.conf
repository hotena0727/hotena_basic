events {}

http {
  server {
    listen 8080;

    # ✅ iOS가 좋아하는 "루트" 경로로 아이콘/manifest 제공
    location = /apple-touch-icon.png { root /app/static_root; }
    location = /icon-192.png         { root /app/static_root; }
    location = /icon-512.png         { root /app/static_root; }
    location = /manifest.json        { root /app/static_root; }
    location = /favicon.ico          { root /app/static_root; }

    # ✅ 나머지는 Streamlit로 프록시
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
